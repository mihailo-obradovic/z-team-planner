minimumReleaseAge: 1440

# * Dependencies whose build scripts are deliberately skipped — none is needed (sharp ships prebuilt @img/* binaries). Denied explicitly because pnpm 12 fails an install on any build left undecided; re-check against a fresh install when dependencies move.
allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': false
  esbuild: false
  protobufjs: false
  sharp: false
  vue-demi: false

# * Lets pnpm link @unhead/vue's bundled agent skill into .claude/skills/ (gitignored there). It runs no code, but agents read it as instructions, so re-read the linked SKILL.md whenever @unhead/vue moves.
permissions:
  '@unhead/vue':
    skills: true

# * Security overrides: each forces a patched copy past a parent's pin that has no fixed release yet (operations.md, GitHub security scanning). Drop a line once its parent ships a range that reaches the fix.
overrides:
  '@firebase/firestore>@grpc/grpc-js': 1.13.6
  editorconfig>minimatch: 11.0.8
  fontless>esbuild: 0.28.2
  js-beautify>glob: 14.0.6
  readdir-glob>minimatch: 11.0.8
