minimumReleaseAge: 1440

# * Dependencies whose build scripts are deliberately skipped — none is needed (sharp ships prebuilt @img/* binaries). Denied explicitly because pnpm 12 fails an install on any build left undecided; re-check against a fresh install when dependencies move.
allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': false
  esbuild: false
  protobufjs: false
  sharp: false
  vue-demi: false
