name: ci

on:
  push:
  # * Fork pull requests never fire `push` here, so without this they would merge unchecked.
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # * mise.toml is the only Node pin, and setup-node cannot read it.
      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # * The budget is measured on a real production build (decision 017). The public runtime values below are build-time placeholders:
      # * this output is measured, never served — the `ready` hook in `nuxt.config.ts` refuses a production build without them.
      - name: Build
        run: pnpm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: /api/v1
          NUXT_PUBLIC_FIREBASE_API_KEY: ci-build-only
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build-only.firebaseapp.com
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build-only
          NUXT_PUBLIC_FIREBASE_APP_ID: ci-build-only
          NUXT_SITE_URL: https://z-team-planner.vercel.app
          NUXT_SITE_ENV: ci

      - name: Bundle budget
        run: pnpm run check:budget

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run pyright

      # * No DATABASE_URL on purpose: the suite gets a real PostgreSQL from testcontainers, on the runner's own Docker daemon.
      - name: Test
        run: uv run pytest
