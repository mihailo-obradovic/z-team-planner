name: backup

on:
  schedule:
    # * 03:00 UTC. Clear of the Thursday 01:00–02:00 Neon maintenance window.
    - cron: '0 3 * * *'
  workflow_dispatch:
  # * migrate.yml calls this before touching the schema, so a dispatched migration always has a dump from minutes earlier rather than from last night.
  workflow_call:
    inputs:
      reason:
        # * Why the caller wants a dump. It lands in the manifest, so a recovery can pick the pre-migration dump by reading it instead of matching timestamps against migration runs.
        description: 'Why this dump is being taken: pre-migration'
        required: false
        type: string
        default: ''

# * Nothing from this repository is read: no checkout, no token, no write scope.
permissions: {}

# * A manual run must never overlap the nightly one — two pg_dumps would wake the same compute at once. Object names do not depend on it: every run stamps its own.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # ! The DIRECT endpoint, plain `postgresql://`. pg_dump is not SQLAlchemy, so no `+psycopg` prefix here — and the pooled endpoint is PgBouncer in transaction mode, where session-scoped tools break (operations.md, Neon Postgres → Quirks).
      DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      BUCKET: ztp-backups
      # * Matches feature 004's declared retention for personal data held in backups.
      RETENTION_DAYS: '30'
      # ! Neon runs Postgres 18 and pg_dump refuses a server newer than itself. The runner's preinstalled client is older, so the matching major is installed below.
      PG_VERSION: '18'
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # * R2 ignores the region but the SDK demands one.
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

    steps:
      - name: Install the matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y "postgresql-client-${PG_VERSION}"
          echo "PGBIN=/usr/lib/postgresql/${PG_VERSION}/bin" >> "$GITHUB_ENV"

      - name: Trust the backup encryption key
        env:
          BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$BACKUP_GPG_PUBLIC_KEY" | gpg --batch --import
          FPR=$(gpg --list-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          # * Only the public half is ever here, so "ultimate" grants nothing but the right to encrypt to it without an interactive trust prompt.
          printf '%s:6:\n' "$FPR" | gpg --batch --import-ownertrust
          echo "GPG_RECIPIENT=${FPR}" >> "$GITHUB_ENV"

      - name: Name this run's objects
        # ! The stamp carries the time, not the date alone. A day can hold several dumps, and keyed by date each would replace the last. The scheduled run starts hours late, so even one early migration shares its day with a later nightly.
        env:
          # * Through env rather than inline, so the input cannot be read as shell.
          REASON_INPUT: ${{ inputs.reason }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # * One instant, two spellings: the key has no colons so it is safe in a shell, and the manifest's taken_at is the same moment in ISO-8601. Both sort chronologically.
          now=$(date -u +%s)
          STAMP=$(date -u -d "@${now}" +%Y-%m-%dT%H%M%SZ)
          echo "TAKEN_AT=$(date -u -d "@${now}" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "DUMP_FILE=ztp-${STAMP}.sql.gz.gpg" >> "$GITHUB_ENV"
          echo "MANIFEST_FILE=ztp-${STAMP}.manifest.json" >> "$GITHUB_ENV"
          # ! A called workflow sees its caller's event, so a migration and a manual dispatch both arrive as workflow_dispatch. Only the input tells them apart.
          case "$REASON_INPUT" in
            '')
              if [ "$EVENT_NAME" = "schedule" ]; then reason=nightly; else reason=manual; fi
              ;;
            pre-migration)
              reason=pre-migration
              ;;
            *)
              echo "::error::unknown reason '$REASON_INPUT'; the only value a caller may pass is: pre-migration"
              exit 1
              ;;
          esac
          echo "REASON=${reason}" >> "$GITHUB_ENV"

      - name: Dump and encrypt
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?NEON_DIRECT_URL secret is not set}"
          "$PGBIN/pg_dump" "$DATABASE_URL" --no-owner --no-acl --format=plain \
            | gzip \
            | gpg --batch --encrypt --recipient "$GPG_RECIPIENT" --output "$DUMP_FILE"
          test -s "$DUMP_FILE"

      - name: Write the manifest
        # * Row counts are what the restore drill compares against, so they must travel with the dump. Counts are not personal data; the manifest stays plaintext.
        run: |
          set -euo pipefail
          # * A census of every public table, not a hard-coded list: a backup must not start failing because a migration renamed something. query_to_xml is the one way plain SQL can count a table whose name it only learns at runtime. alembic_version stays in it like any other table; its revision gets a field of its own below.
          counts=$("$PGBIN/psql" "$DATABASE_URL" -Atc \
            "select coalesce(json_object_agg(relname, row_count), '{}'::json)
             from (
               select c.relname,
                      (xpath('/row/c/text()',
                             query_to_xml(format('select count(*) as c from %I.%I',
                                                 ns.nspname, c.relname),
                                          false, true, '')))[1]::text::bigint as row_count
               from pg_class c
               join pg_namespace ns on ns.oid = c.relnamespace
               where c.relkind = 'r' and ns.nspname = 'public'
             ) s")
          # ! A backup must name exactly one schema revision or fail. A missing table counts as zero rows: the schema is gone and the dump is empty — the one failure mode a green nightly job would hide. Several rows means a schema no forward-only migration left behind (decision 010).
          stamped=$(printf '%s' "$counts" | jq '.alembic_version // 0')
          if [ "$stamped" != 1 ]; then
            echo "::error::alembic_version holds $stamped rows, not 1 — no schema revision to record (0 means the schema is gone)"
            exit 1
          fi
          # * Which schema the dump holds, so a recovery can confirm it picked the dump from before a migration and the drill can confirm the restore landed there.
          revision=$("$PGBIN/psql" "$DATABASE_URL" -Atc "select version_num from alembic_version")
          jq -n \
            --argjson counts "$counts" \
            --arg taken_at "$TAKEN_AT" \
            --arg reason "$REASON" \
            --arg revision "$revision" \
            --arg dump "$DUMP_FILE" \
            --argjson bytes "$(stat -c %s "$DUMP_FILE")" \
            '{taken_at: $taken_at, reason: $reason, revision: $revision, dump: $dump, encrypted_bytes: $bytes, rows: $counts}' \
            > "$MANIFEST_FILE"
          cat "$MANIFEST_FILE"

      - name: Upload to R2
        # ! A dump is never replaced. If-None-Match makes R2 answer 412 when the key exists, so a collision fails the run instead of silently costing the earlier dump.
        run: |
          set -euo pipefail
          aws s3api put-object --bucket "$BUCKET" --key "$DUMP_FILE" --body "$DUMP_FILE" --if-none-match '*'
          aws s3api put-object --bucket "$BUCKET" --key "$MANIFEST_FILE" --body "$MANIFEST_FILE" --if-none-match '*'

      - name: Prune dumps past the retention window
        # * Only after a successful upload: a failed dump must never shrink the set.
        run: |
          set -euo pipefail
          threshold=$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix ztp- \
            --query "Contents[?LastModified<'${threshold}'].Key" --output text \
            | tr '\t' '\n' \
            | while read -r key; do
                [ -n "$key" ] || continue
                echo "pruning $key"
                aws s3api delete-object --bucket "$BUCKET" --key "$key"
              done

      - name: Destroy the local copies
        # ! This repository is public. A dump holds user emails, so it never becomes a workflow artifact and never outlives the job.
        if: always()
        run: rm -f ztp-*.sql.gz.gpg ztp-*.manifest.json
