name: ci

on: push

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # * mise.toml is the only Node pin (stacks/_lang/typescript/typescript.md, Node Version),
      # * and setup-node cannot read it — it takes .nvmrc, .node-version, .tool-versions or
      # * package.json. Changes: replaces actions/setup-node, whose node-version-file pointed
      # * at the .nvmrc this repo deleted when mise took over the pin, failing the whole job.
      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # * setup-node's `cache: pnpm` left with the step above, so the store is cached here
      # * instead, keyed to the lockfile.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      # * Was missing, and master drifted out of format while CI stayed green.
      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # * uv provisions the interpreter from .python-version; no setup-python step is needed.
      - name: Install dependencies
        # * --locked fails on a stale lockfile instead of silently resolving other versions.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run pyright

      # * No DATABASE_URL here on purpose: the suite builds its own settings and gets a real
      # * PostgreSQL from testcontainers. Verified by running it with no .env and no env vars.
      # * ubuntu-latest ships a running Docker daemon, so the integration tests really run
      # * here rather than skipping.
      - name: Test
        run: uv run pytest
